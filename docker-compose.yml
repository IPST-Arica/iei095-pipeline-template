services:
  pipeline:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace

  dashboard:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8050:8050"
    command: python dashboard/app.py

  jupyter:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8888:8888"
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
